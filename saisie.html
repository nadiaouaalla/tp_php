<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie des notes</title>
</head>
<body>
    <h1>Saisie des notes des apprenants</h1>

    <form action="traitement.php" method="POST">
        <label>Nom :</label>
        <input type="text" name="nom" required>
        <br><br>

        <label>Note Informatique :</label>
        <input type="number" name="note_info"
               min="0" max="20" step="0.01" required>
        <br><br>

        <label>Note Mathématiques :</label>
        <input type="number" name="note_math"
               min="0" max="20" step="0.01" required>
        <br><br>

        <button type="submit">Enregistrer</button>
    </form>
</body>
</html>
